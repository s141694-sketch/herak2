# Harak on one server (the pilot; runbook: docs/2026-10-06-harak2-runbook.md). Run from the repository's root:
#   docker compose --env-file backend/.env -f infra/docker-compose.yml up -d
# backend/.env starts from infra/pilot.env.example; compose takes HARAK_DOMAIN and POSTGRES_PASSWORD from it.
name: harak2

x-backend: &backend
  build:
    context: ..
    dockerfile: infra/backend.Dockerfile
  env_file: ../backend/.env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.production
    DATABASE_URL: postgres://harak:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}@postgres:5432/harak
    REDIS_URL: redis://redis:6379/0
    COLLAB_INTERNAL_URL: http://collab:1234
    # Two proxies append to X-Forwarded-For before Django: the TLS front (caddy, or the organization's load balancer)
    # and nginx. Rate limits then count the client's address, not the front's (D73, D88).
    NUM_PROXIES: "2"
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: harak
      POSTGRES_USER: harak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U harak -d harak"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single sign-on tests only (D62): two realms standing for two organizations' identity providers.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    profiles: ["sso-test"]
    command: ["start-dev", "--import-realm", "--http-port", "8180", "--hostname", "http://localhost:8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-harak-sso-test-admin}
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import:ro
    ports:
      - "8180:8180"

  redis:
    image: redis:8.10.2
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    <<: *backend
    command: ["sh", "-c", "python manage.py migrate --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --access-logfile -"]
    # Reached only through nginx (the frontend service): its body limit, and the one proxy NUM_PROXIES counts (D73,
    # phase 7 review). Not published on the host.
    healthcheck:
      # As the TLS front would send it: otherwise the production settings answer with a redirect to https, which
      # curl takes for success without the health view ever running (D88). "backend" is a host Django must allow
      # anyway: the collaboration service calls it by that name.
      test: ["CMD", "curl", "-fsS", "-H", "Host: backend", "-H", "X-Forwarded-Proto: https", "http://localhost:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "--loglevel=INFO", "--concurrency=2"]
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel=INFO", "--pidfile=/tmp/beat.pid"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/beat.pid && kill -0 $$(cat /tmp/beat.pid)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # A backup of the database and the files every day (spec 7.4, D83), kept BACKUP_KEEP_DAYS days. In production
  # the backups volume must live off this host (a mounted network share or similar), or a lost host loses both.
  backup:
    <<: *backend
    command: ["sh", "-c", "while true; do python manage.py backup --dest /backups || echo 'the backup failed'; sleep 86400; done"]
    volumes:
      - backups:/backups

  collab:
    build:
      context: ..
      dockerfile: infra/collab.Dockerfile
    env_file: ../backend/.env
    environment:
      PORT: "1234"
      DJANGO_INTERNAL_URL: http://backend:8000
    # Reached through nginx at /collab/, like the backend.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:1234/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ..
      dockerfile: infra/frontend.Dockerfile
    # Reached from the internet only through caddy. On this host, 8080 serves a TLS front of the host's own instead
    # of caddy, and checks.
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
      collab:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

  # TLS for HARAK_DOMAIN (D88): a certificate from a public authority, renewed on its own, kept in caddy-data.
  caddy:
    image: caddy:2.11.7
    environment:
      HARAK_DOMAIN: ${HARAK_DOMAIN:?set HARAK_DOMAIN in backend/.env}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2019/config/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  backups:
  caddy-data:
  caddy-config:
