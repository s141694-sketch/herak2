# The scheme the client used. TLS ends in front of nginx (Caddy in compose, or the organization's own load
# balancer), which says so in X-Forwarded-Proto; overwriting it with nginx's own scheme (http) would make the
# production settings redirect every request to https forever (task 8.6, D88). Without a front: nginx's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# The services by name, looked up again through Docker's DNS as their addresses change: a backend or collab container
# recreated by an update or a restart gets a new address, and an address resolved once at start would send requests
# to whatever container holds the old one (D88).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server backend:8000 resolve;
}

upstream collab {
    zone collab 64k;
    server collab:1234 resolve;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The two services call each other directly on the private network; nothing outside needs these (D88).
    location /api/internal/ {
        return 404;
    }

    location /collab/internal/ {
        return 404;
    }

    location /api/ {
        # A curriculum uploaded for an import may be up to 10 MB (IMPORT_MAX_FILE_BYTES); nginx's default is 1 MB.
        client_max_body_size 11m;
        proxy_pass http://backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /collab/ {
        proxy_pass http://collab/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
