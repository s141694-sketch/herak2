# The scheme the client used. TLS ends in front of nginx (Caddy in compose, or the organization's own load
# balancer), which says so in X-Forwarded-Proto; overwriting it with nginx's own scheme (http) would make the
# production settings redirect every request to https forever (task 8.6, D88). Without a front: nginx's scheme.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The two services call each other directly on the private network; nothing outside needs these (D88).
    location /api/internal/ {
        return 404;
    }

    location /collab/internal/ {
        return 404;
    }

    location /api/ {
        # A curriculum uploaded for an import may be up to 10 MB (IMPORT_MAX_FILE_BYTES); nginx's default is 1 MB.
        client_max_body_size 11m;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /collab/ {
        proxy_pass http://collab:1234/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri /index.html;
    }
}
