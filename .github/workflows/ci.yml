name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: harak
          POSTGRES_USER: harak
          POSTGRES_PASSWORD: harak
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U harak" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: LibreOffice and Arabic fonts for the PDF export (D78)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-noto-core
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Keycloak for the single sign-on tests (D62)
        working-directory: .
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=harak-sso-test-admin \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm --http-port 8180 --hostname http://localhost:8180
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8180/realms/safety/.well-known/openid-configuration > /dev/null
      - run: uv run pytest
        env:
          HARAK_REQUIRE_SOFFICE: "1"
          DATABASE_URL: postgres://harak:harak@127.0.0.1:54329/harak
          REDIS_URL: redis://127.0.0.1:6380/1
          KEYCLOAK_URL: http://localhost:8180

  javascript:
    name: ${{ matrix.workspace }} (node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shared, collab, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w ${{ matrix.workspace }}
      - run: npm test -w ${{ matrix.workspace }}
      - if: matrix.workspace == 'frontend'
        run: npm run build -w frontend

  compose:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cp backend/.env.example backend/.env
      - run: docker compose -f infra/docker-compose.yml config --quiet

  e2e:
    name: browser tests (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: harak
          POSTGRES_USER: harak
          POSTGRES_PASSWORD: harak
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U harak" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
        working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Keycloak for the single sign-on journey (D62)
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=harak-sso-test-admin \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm --http-port 8180 --hostname http://localhost:8180
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null
      - run: npx playwright test
        working-directory: frontend
        env:
          KEYCLOAK_URL: http://localhost:8180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: frontend/e2e/screenshots
          if-no-files-found: ignore
