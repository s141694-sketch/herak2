name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: harak
          POSTGRES_USER: harak
          POSTGRES_PASSWORD: harak
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U harak" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: LibreOffice and Arabic fonts for the PDF export (D78)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-noto-core
      - name: pg_dump and pg_restore of the server's version, for the backup tests (D83)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-18
          pg_dump --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Keycloak for the single sign-on tests (D62)
        working-directory: .
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=harak-sso-test-admin \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm --http-port 8180 --hostname http://localhost:8180
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8180/realms/safety/.well-known/openid-configuration > /dev/null
      - run: uv run pytest
        env:
          HARAK_REQUIRE_SOFFICE: "1"
          DATABASE_URL: postgres://harak:harak@127.0.0.1:54329/harak
          REDIS_URL: redis://127.0.0.1:6380/1
          KEYCLOAK_URL: http://localhost:8180

  javascript:
    name: ${{ matrix.workspace }} (node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shared, collab, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w ${{ matrix.workspace }}
      - run: npm test -w ${{ matrix.workspace }}
      - if: matrix.workspace == 'frontend'
        run: npm run build -w frontend

  compose:
    name: docker compose stack and smoke check
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file backend/.env -f infra/docker-compose.yml -f infra/compose.ci.yml
    steps:
      - uses: actions/checkout@v5
      # A production configuration as the runbook makes one, with fresh secrets, for https://localhost (task 8.6).
      - name: configuration
        run: |
          secret() { openssl rand -hex 32; }
          {
            grep -v -E '^(HARAK_DOMAIN|ALLOWED_HOSTS|CSRF_TRUSTED_ORIGINS|APP_URL|SECRET_KEY|COLLAB_TOKEN_SECRET|COLLAB_SERVICE_SECRET|POSTGRES_PASSWORD|FIELD_ENCRYPTION_KEYS|EMAIL_URL|FILES_[A-Z_]+)=' infra/pilot.env.example
            echo "HARAK_DOMAIN=localhost"
            echo "ALLOWED_HOSTS=localhost,backend"
            echo "CSRF_TRUSTED_ORIGINS=https://localhost"
            echo "APP_URL=https://localhost"
            echo "SECRET_KEY=$(secret)"
            echo "COLLAB_TOKEN_SECRET=$(secret)"
            echo "COLLAB_SERVICE_SECRET=$(secret)"
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "FIELD_ENCRYPTION_KEYS=$(openssl rand 32 | base64 | tr '+/' '-_')"
            echo "EMAIL_URL=consolemail://"
            # The in-memory store of infra/compose.ci.yml.
            printf '%s\n' FILES_BUCKET=harak2-ci FILES_ENDPOINT_URL=http://s3:5000 FILES_ACCESS_KEY_ID=ci \
              FILES_SECRET_ACCESS_KEY=ci FILES_REGION=us-east-1 FILES_CREATE_BUCKET=True
          } > backend/.env
      - run: $COMPOSE config --quiet
      # The images build, with LibreOffice and the PostgreSQL 18 client in the backend's (D78, D83).
      - run: $COMPOSE build backend collab frontend
      - run: $COMPOSE up -d
      - run: infra/healthcheck.sh 300
      # Caddy's local authority signed the certificate for localhost; the smoke check trusts it (D88).
      - name: smoke check through TLS
        run: |
          for _ in $(seq 1 30); do
            $COMPOSE cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt 2>/dev/null && break
            sleep 2
          done
          SMOKE_CACERT=root.crt infra/smoke.sh https://localhost
      - name: an organization and its first manager, then the pilot's measures
        run: |
          $COMPOSE exec -T backend python manage.py create_organization --name "مركز التدريب" --slug ci --admin-email admin@ci.test
          $COMPOSE exec -T backend python manage.py pilot_metrics --organization ci | grep "no programs"
      # The runbook's restore (section 6), as written: a backup, then the database and the store lost, then both
      # restored and checked by the restore command, then the stack up and checked again (D83, D88).
      - name: backup, loss and restore on PostgreSQL 18
        run: |
          $COMPOSE exec -T backend python manage.py shell -c "from apps.files import storage; storage.write('ci/kept.txt', b'harak', 'text/plain')"
          folder="$($COMPOSE exec -T backup python manage.py backup --dest /backups | sed -n 's/^backed up to //p')"
          test -n "$folder"
          $COMPOSE stop backend worker beat collab backup
          $COMPOSE restart s3
          $COMPOSE exec -T postgres dropdb -U harak harak
          $COMPOSE exec -T postgres createdb -U harak harak
          $COMPOSE run --rm --no-deps backup python manage.py restore "$folder"
          $COMPOSE up -d
          infra/healthcheck.sh 300
          SMOKE_CACERT=root.crt infra/smoke.sh https://localhost
          $COMPOSE exec -T backend python manage.py pilot_metrics --organization ci | grep "no programs"
          $COMPOSE exec -T backend python manage.py shell -c "from apps.files import storage; assert storage.read('ci/kept.txt') == b'harak'"
      - if: failure()
        run: $COMPOSE ps && $COMPOSE logs --tail 80

  e2e:
    name: browser tests (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: harak
          POSTGRES_USER: harak
          POSTGRES_PASSWORD: harak
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U harak" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
        working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: LibreOffice and Arabic fonts, so approval in the browser ends with a real PDF (D78)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-noto-core
      - name: Keycloak for the single sign-on journey (D62)
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=harak-sso-test-admin \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm --http-port 8180 --hostname http://localhost:8180
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null
      - run: npx playwright test
        working-directory: frontend
        env:
          KEYCLOAK_URL: http://localhost:8180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: frontend/e2e/screenshots
          if-no-files-found: ignore
