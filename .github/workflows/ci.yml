name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: harak
          POSTGRES_USER: harak
          POSTGRES_PASSWORD: harak
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U harak" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --frozen --python ${{ matrix.python }}
      - name: LibreOffice and Arabic fonts for the PDF export (D78)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-noto-core
      - name: pg_dump and pg_restore of the server's version, for the backup tests (D83)
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q --no-install-recommends postgresql-client-18
          pg_dump --version
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
      - name: Keycloak for the single sign-on tests (D62)
        working-directory: .
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=harak-sso-test-admin \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm --http-port 8180 --hostname http://localhost:8180
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8180/realms/safety/.well-known/openid-configuration > /dev/null
      - run: uv run pytest
        env:
          HARAK_REQUIRE_SOFFICE: "1"
          DATABASE_URL: postgres://harak:harak@127.0.0.1:54329/harak
          REDIS_URL: redis://127.0.0.1:6380/1
          KEYCLOAK_URL: http://localhost:8180

  javascript:
    name: ${{ matrix.workspace }} (node 24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [shared, collab, frontend]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck -w ${{ matrix.workspace }}
      - run: npm test -w ${{ matrix.workspace }}
      - if: matrix.workspace == 'frontend'
        run: npm run build -w frontend

  compose:
    name: docker compose stack and smoke check
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose --env-file backend/.env -f infra/docker-compose.yml -f infra/compose.ci.yml
    steps:
      - uses: actions/checkout@v5
      # A production configuration as the runbook makes one, with fresh secrets, for https://localhost (task 8.6).
      - name: configuration
        run: |
          secret() { openssl rand -hex 32; }
          {
            grep -v -E '^(HARAK_DOMAIN|ALLOWED_HOSTS|CSRF_TRUSTED_ORIGINS|APP_URL|SECRET_KEY|COLLAB_TOKEN_SECRET|COLLAB_SERVICE_SECRET|POSTGRES_PASSWORD|FIELD_ENCRYPTION_KEYS|EMAIL_URL|FILES_[A-Z_]+)=' infra/pilot.env.example
            echo "HARAK_DOMAIN=localhost"
            echo "ALLOWED_HOSTS=localhost,backend"
            echo "CSRF_TRUSTED_ORIGINS=https://localhost"
            echo "APP_URL=https://localhost"
            echo "SECRET_KEY=$(secret)"
            echo "COLLAB_TOKEN_SECRET=$(secret)"
            echo "COLLAB_SERVICE_SECRET=$(secret)"
            echo "POSTGRES_PASSWORD=$(secret)"
            echo "FIELD_ENCRYPTION_KEYS=$(openssl rand 32 | base64 | tr '+/' '-_')"
            echo "EMAIL_URL=consolemail://"
            # The in-memory store of infra/compose.ci.yml.
            printf '%s\n' FILES_BUCKET=harak2-ci FILES_ENDPOINT_URL=http://s3:5000 FILES_ACCESS_KEY_ID=ci \
              FILES_SECRET_ACCESS_KEY=ci FILES_REGION=us-east-1 FILES_CREATE_BUCKET=True
          } > backend/.env
      - run: $COMPOSE config --quiet
      # The images build, with LibreOffice and the PostgreSQL 18 client in the backend's (D78, D83).
      - run: $COMPOSE build backend collab frontend
      - run: $COMPOSE up -d
      - run: infra/healthcheck.sh 300
      # Caddy's local authority signed the certificate for localhost; the smoke check trusts it (D88).
      - name: smoke check through TLS
        run: |
          for _ in $(seq 1 30); do
            $COMPOSE cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt 2>/dev/null && break
            sleep 2
          done
          SMOKE_CACERT=root.crt infra/smoke.sh https://localhost
      - name: an organization and its first manager, then the pilot's measures
        run: |
          $COMPOSE exec -T backend python manage.py create_organization --name "مركز التدريب" --slug ci --admin-email admin@ci.test
          $COMPOSE exec -T backend python manage.py pilot_metrics --organization ci | grep "no programs"
      # The runbook's restore (section 6), as written: a backup, then the database and the store lost, then both
      # restored and checked by the restore command, then the stack up and checked again (D83, D88).
      - name: backup, loss and restore on PostgreSQL 18
        run: |
          $COMPOSE exec -T backend python manage.py shell -c "from apps.files import storage; storage.write('ci/kept.txt', b'harak', 'text/plain')"
          folder="$($COMPOSE exec -T backup python manage.py backup --dest /backups | sed -n 's/^backed up to //p')"
          test -n "$folder"
          $COMPOSE stop backend worker beat collab backup
          $COMPOSE restart s3
          $COMPOSE exec -T postgres dropdb -U harak harak
          $COMPOSE exec -T postgres createdb -U harak harak
          $COMPOSE run --rm --no-deps backup python manage.py restore "$folder"
          $COMPOSE up -d
          infra/healthcheck.sh 300
          SMOKE_CACERT=root.crt infra/smoke.sh https://localhost
          $COMPOSE exec -T backend python manage.py pilot_metrics --organization ci | grep "no programs"
          $COMPOSE exec -T backend python manage.py shell -c "from apps.files import storage; assert storage.read('ci/kept.txt') == b'harak'"
      - if: failure()
        run: $COMPOSE ps && $COMPOSE logs --tail 80

  try-local:
    name: the owner's local trial script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # As the owner runs it on their computer (infra/try-local.sh): an organization and its manager's link, then the
      # demo accounts, a sign-in with one of them, and the stop and reset.
      - name: start, open an organization, choose the manager's password, sign in
        run: |
          infra/try-local.sh | tee trial.log
          link="$(grep -o 'https://localhost/set-password?[^[:space:]]*' trial.log)"
          query="${link#*\?}"
          uid="$(echo "$query" | sed -n 's/.*uid=\([^&]*\).*/\1/p')"
          token="$(echo "$query" | sed -n 's/.*token=\([^&]*\).*/\1/p')"
          org="$(echo "$query" | sed -n 's/.*org=\([0-9]*\).*/\1/p')"
          test -n "$uid" && test -n "$token" && test -n "$org"
          api() { curl -sk -b jar -c jar -H "Content-Type: application/json" -H "Referer: https://localhost/" \
            -H "X-CSRFToken: $(awk '$6=="csrftoken"{print $7}' jar 2>/dev/null)" "$@"; }
          api https://localhost/api/auth/csrf/ > /dev/null
          api -X POST https://localhost/api/auth/password/set/ -o /dev/null -w "%{http_code}\n" \
            -d "{\"uid\":\"$uid\",\"token\":\"$token\",\"password\":\"a-trial-password-123\",\"organization\":$org}" | grep 204
          api -X POST https://localhost/api/auth/login/ \
            -d '{"email":"manager@example.com","password":"a-trial-password-123"}' | grep '"slug":"trial"'
      - name: the demo accounts, and a sign-in with one of them
        run: |
          infra/try-local.sh --demo
          rm -f jar
          api() { curl -sk -b jar -c jar -H "Content-Type: application/json" -H "Referer: https://localhost/" \
            -H "X-CSRFToken: $(awk '$6=="csrftoken"{print $7}' jar 2>/dev/null)" "$@"; }
          api https://localhost/api/auth/csrf/ > /dev/null
          api -X POST https://localhost/api/auth/login/ \
            -d '{"email":"author@example.com","password":"harak-demo-password"}' | grep '"role":"author"'
      - name: stop, then reset
        run: |
          infra/try-local.sh --stop
          infra/try-local.sh --reset
          test ! -f backend/.env

  deploy-script:
    name: the server deployment script
    runs-on: ubuntu-latest
    env:
      # As infra/deploy.sh setup would be answered: files kept on the server itself, its default (D98).
      HARAK_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v5
      - name: setup, start, and refusing to write over the configuration
        run: |
          infra/deploy.sh setup < /dev/null
          test "$(stat -c %a backend/.env)" = 600
          ! infra/deploy.sh setup < /dev/null
          infra/deploy.sh start
      - name: an organization, its manager's password from the printed link, an invited colleague's link
        run: |
          ORG_NAME="مركز التدريب" ORG_SLUG=center ADMIN_EMAIL=manager@example.com infra/deploy.sh organization | tee org.log
          link="$(grep -o 'https://localhost/set-password?[^[:space:]]*' org.log)"
          query="${link#*\?}"
          uid="$(echo "$query" | sed -n 's/.*uid=\([^&]*\).*/\1/p')"
          token="$(echo "$query" | sed -n 's/.*token=\([^&]*\).*/\1/p')"
          org="$(echo "$query" | sed -n 's/.*org=\([0-9]*\).*/\1/p')"
          api() { curl -sk -b jar -c jar -H "Content-Type: application/json" -H "Referer: https://localhost/" \
            -H "X-CSRFToken: $(awk '$6=="csrftoken"{print $7}' jar 2>/dev/null)" "$@"; }
          api https://localhost/api/auth/csrf/ > /dev/null
          api -X POST https://localhost/api/auth/password/set/ -o /dev/null -w "%{http_code}\n" \
            -d "{\"uid\":\"$uid\",\"token\":\"$token\",\"password\":\"a-server-password-123\",\"organization\":$org}" | grep 204
          api -X POST https://localhost/api/auth/login/ \
            -d '{"email":"manager@example.com","password":"a-server-password-123"}' | grep '"slug":"center"'
          api -X POST https://localhost/api/organizations/current/members/ \
            -d '{"email":"colleague@example.com","role":"author"}' | grep '"status":"invited"'
          infra/deploy.sh link colleague@example.com center | grep -o 'https://localhost/set-password?[^[:space:]]*&org=[0-9]*'
          infra/deploy.sh link manager@example.com center | grep "no link"
          infra/deploy.sh status
      - name: a file kept on the server, downloaded through its signed link, after a restart and in a backup
        run: |
          hc() { docker compose --env-file backend/.env -f infra/docker-compose.yml "$@"; }
          hc exec -T backend python manage.py shell -c "from apps.files import storage; storage.write('ci/kept.txt', b'harak', 'text/plain')"
          hc restart backend worker
          infra/healthcheck.sh 300
          link="$(hc exec -T backend python manage.py shell -c "from apps.files import storage; print(storage.signed_link('ci/kept.txt', name='kept.txt', content_type='text/plain'))" | tail -1)"
          test "$(curl -sk "https://localhost$link")" = harak
          hc exec -T backup python manage.py backup --dest /backups | tee backup.log
          folder="$(sed -n 's/^backed up to //p' backup.log)"
          hc exec -T backup cat "$folder/files/ci/kept.txt" | grep -x harak
      - if: failure()
        run: docker compose --env-file backend/.env -f infra/docker-compose.yml logs --tail 60

  codespace-script:
    name: the Codespace script
    runs-on: ubuntu-latest
    env:
      # As GitHub sets them in a Codespace; the script makes the public address from them (D99).
      CODESPACE_NAME: ci-test
      GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN: app.example.test
      PUBLIC: ci-test-8000.app.example.test
    steps:
      - uses: actions/checkout@v5
      - name: start, then requests as GitHub's port forwarding sends them (Host localhost:8000, no scheme)
        run: |
          infra/codespace.sh start
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/health/)" = 200
          curl -s http://localhost:8000/ | grep -q '<div id="root"'
          code="$(curl -s --http1.1 -o /dev/null -w '%{http_code}' -m 5 -H 'Connection: Upgrade' -H 'Upgrade: websocket' \
            -H 'Sec-WebSocket-Version: 13' -H 'Sec-WebSocket-Key: c21va2UtY2hlY2stMDAwMA==' http://localhost:8000/collab || true)"
          echo "the live-editing connection opens: $code"; test "$code" = 101
          # The client address GitHub's forwarder would add is the one passed on, as Caddy does.
          curl -s -o /dev/null -H 'X-Forwarded-For: 203.0.113.9' http://localhost:8000/api/health/
          docker compose --env-file backend/.env -f infra/docker-compose.yml -f infra/compose.codespaces.yml logs front \
            | grep -q '^front.*203\.0\.113\.9 '
      - name: the demo accounts, each with its own password, made once, and a sign-in from the public address
        run: |
          infra/codespace.sh demo | tee demo.log
          password="$(awk '$1=="author@example.com"{print $2}' demo.log)"
          admin="$(awk '$1=="multi@example.com"{print $2}' demo.log)"
          test -n "$password" && test -n "$admin" && test "$password" != "$admin"
          origin="https://$PUBLIC"
          token="$(curl -s -D - -o /dev/null http://localhost:8000/api/auth/csrf/ | sed -n 's/^[Ss]et-[Cc]ookie: csrftoken=\([^;]*\).*/\1/p' | tr -d '\r')"
          test -n "$token"
          # GitHub's forwarding rewrites the browser's Origin to https://localhost:8000; the proxy puts the public
          # one back (D102). A foreign Origin still fails the CSRF check.
          login() {
            curl -s -H "Content-Type: application/json" -H "Origin: ${ORIGIN:-https://localhost:8000}" -H "Referer: $origin/" \
              -H "X-CSRFToken: $token" -H "Cookie: csrftoken=$token" -X POST http://localhost:8000/api/auth/login/ \
              -d "{\"email\":\"$1\",\"password\":\"$2\"}"
          }
          login author@example.com "$password" | grep '"role":"author"'
          ORIGIN=https://evil.example login author@example.com "$password" | grep -q 'Origin checking failed'
          # The browser tests' other accounts cannot be signed in to here.
          ! login sso-admin@example.com "$password" | grep -q '"user"'
          hc() { docker compose --env-file backend/.env -f infra/docker-compose.yml -f infra/compose.codespaces.yml "$@"; }
          hc exec -T backend python manage.py shell -c "from apps.accounts.models import User; assert not User.objects.get(email='sso-admin@example.com').has_usable_password()"
          # A second run prints the same accounts and resets nothing.
          infra/codespace.sh demo | grep -F "$password"
      - name: an organization, its emailed link readable, a file through the public address, stop
        run: |
          ORG_NAME="مركز" ORG_SLUG=center ADMIN_EMAIL=manager@example.com infra/codespace.sh organization | tee org.log
          grep -q "https://$PUBLIC/set-password?uid=.*&org=[0-9][0-9]*" org.log
          grep -q "infra/codespace.sh link <email> center" org.log
          for _ in $(seq 1 20); do infra/codespace.sh emails | grep -q "https://$PUBLIC/set-password?uid=" && break; sleep 3; done
          infra/codespace.sh emails | grep "https://$PUBLIC/set-password?uid="
          hc() { docker compose --env-file backend/.env -f infra/docker-compose.yml -f infra/compose.codespaces.yml "$@"; }
          hc exec -T backend python manage.py shell -c "from apps.files import storage; storage.write('ci/kept.txt', b'harak', 'text/plain')"
          link="$(hc exec -T backend python manage.py shell -c "from apps.files import storage; print(storage.signed_link('ci/kept.txt', name='kept.txt', content_type='text/plain'))" | tail -1)"
          test "$(curl -s "http://localhost:8000$link")" = harak
          infra/codespace.sh status
          infra/codespace.sh stop
      - if: failure()
        run: docker compose --env-file backend/.env -f infra/docker-compose.yml -f infra/compose.codespaces.yml logs --tail 60

  e2e:
    name: browser tests (playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: harak
          POSTGRES_USER: harak
          POSTGRES_PASSWORD: harak
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U harak" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8.10.2
        ports: ["6380:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CI: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.x"
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen --python 3.13
        working-directory: backend
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: LibreOffice and Arabic fonts, so approval in the browser ends with a real PDF (D78)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui fonts-noto-core
      - name: Keycloak for the single sign-on journey (D62)
        run: |
          docker run -d --name keycloak -p 8180:8180 \
            -v "$PWD/infra/keycloak/realms:/opt/keycloak/data/import:ro" \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=harak-sso-test-admin \
            quay.io/keycloak/keycloak:26.8.0 start-dev --import-realm --http-port 8180 --hostname http://localhost:8180
          for i in $(seq 1 60); do
            curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null && break
            sleep 3
          done
          curl -sf http://localhost:8180/realms/vtc/.well-known/openid-configuration > /dev/null
      - run: npx playwright test
        working-directory: frontend
        env:
          KEYCLOAK_URL: http://localhost:8180
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-screenshots
          path: frontend/e2e/screenshots
          if-no-files-found: ignore
